[tool.poetry]
name = "backend-academy-2024-python-template"
version = "0.1.0"
description = ""
package-mode = false
authors = ["n.beskodarov <n.beskodarov@tinkoff.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.32.3"
mypy = "^1.13.0"


[tool.poetry.dev-dependencies]
black = "^24.8.0"
isort = "^5.13.2"
ruff = "^0.6.1"
pytest = "*"
pytest-cov = "*"
pytest-deadfixtures = "*"
pytest-mock = "*"
pytest-repeat = "*"
pytest-asyncio = "*"

[tool.poetry.scripts]
analyzer = "hello:hi"


[tool.poetry.group.dev.dependencies]
types-requests = "^2.32.0.20241016"
pytest = "^8.3.3"
pytest-cov = "^6.0.0"

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # Не совместимо с другими линтами
    "D212",    # Делает докстринги некрасивыми 
    "COM812",  # Не совместимо с форматтером
    "ISC001",  # Может конфликтовать с форматтером
    "RUF002",  # Кириллица в докстрингах
   ]

 